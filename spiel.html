<meta name="description" content="BASIC-Programm SPIEL — Zahlen-Ordnungs-Spiel: Kolonne durch Umdrehen von Praefixen sortieren." />
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#0B0E14; color:#E4E4E4;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  .page { max-width:900px; margin:0 auto; padding:28px 20px 64px; }
  .back { display:inline-block; color:#87C3FF; text-decoration:none; margin-bottom:18px; font-size:14px; }
  h1 { font-size:26px; letter-spacing:5px; margin:0 0 6px; }
  .sub { color:#A3B0C4; font-size:14px; margin-bottom:20px; line-height:1.5; }
  #tty { background:#101214; border:1px solid #23272f; border-radius:8px;
    padding:14px 16px; min-height:180px; max-height:62vh; overflow:auto;
    white-space:pre-wrap; font-size:14px; line-height:1.55; color:#3FA266; }
  #tty .in-line { color:#87C3FF; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  input, select { background:#181818; border:1px solid #23272f; color:#E4E4E4;
    border-radius:6px; padding:8px 10px; font:inherit; }
  button { background:#599CE7; color:#191C22; border:0; border-radius:6px;
    padding:8px 16px; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:#87C3FF; border:1px solid #23272f; }
  button.pill { background:#181818; color:#E4E4E4; border:1px solid #23272f; padding:6px 14px; }
  button.sel { border-color:#599CE7; color:#87C3FF; }

</style></head><body>
<div class="page">
  <a class="back" href="index.html">&larr; Uebersicht</a>
  <h1>SPIEL</h1>
  <div class="sub">BASIC-Programm SPIEL — Zahlen-Ordnungs-Spiel: Kolonne durch Umdrehen von Praefixen sortieren.</div>
  <div id="tty" aria-live="polite"></div>
  <div id="ui"></div>
  <div class="sub" style="margin-top:24px">Original-Listing: <a href="listings/SPIEL.pdf">PDF-Scan</a> · <a href="listings/SPIEL.txt">TXT (OCR)</a></div>
</div>
<script>
const ttyEl = document.getElementById('tty');
const tty = {
  print(s = "") { const d = document.createElement("div"); d.textContent = s;
    ttyEl.appendChild(d); ttyEl.scrollTop = ttyEl.scrollHeight; },
  html(s) { const d = document.createElement("div"); d.innerHTML = s;
    ttyEl.appendChild(d); ttyEl.scrollTop = ttyEl.scrollHeight; },
  clear() { ttyEl.innerHTML = ""; },
  input(prompt, mode) {
    return new Promise((res) => {
      const f = document.createElement("form");
      f.className = "row";
      const lb = document.createElement("span"); lb.textContent = prompt;
      lb.style.cssText = "color:#87C3FF";
      const inp = document.createElement("input");
      inp.autocomplete = "off"; inp.style.cssText = "flex:1;min-width:100px";
      if (mode) inp.inputMode = mode;
      const b = document.createElement("button"); b.type = "submit"; b.textContent = "Eingabe";
      f.append(lb, inp, b);
      ttyEl.appendChild(f); inp.focus(); ttyEl.scrollTop = ttyEl.scrollHeight;
      f.onsubmit = (e) => { e.preventDefault(); const v = inp.value; f.remove();
        tty.print(prompt + " " + v); res(v); };
    });
  },
  buttons(label, opts) {
    return new Promise((res) => {
      const w = document.createElement("div"); w.className = "row";
      if (label) { const s = document.createElement("span");
        s.textContent = label; s.style.color = "#87C3FF"; w.appendChild(s); }
      opts.forEach((o) => { const b = document.createElement("button");
        b.type = "button"; b.textContent = o.label; b.className = o.cls || "pill";
        b.onclick = () => { w.remove(); tty.print(label ? label + " " + o.label : o.label); res(o.value); };
        w.appendChild(b); });
      ttyEl.appendChild(w); ttyEl.scrollTop = ttyEl.scrollHeight;
    });
  },
};

async function main(tty) {
  tty.print('                        ***** "ZAHLEN-ORDNUNGS-SPIEL" ****');
  tty.print("");
  const j = await tty.buttons("WUENSCHEN SIE ERLAEUTERUNGEN ? [JA/NEIN]",
    [{ label: "JA", value: "JA" }, { label: "NEIN", value: "NEIN" }]);
  if (j === "JA") {
    tty.print("DIES IST DAS ZAHLEN-SORTIER-SPIEL");
    tty.print("ORDNE EINE ZAHLEN-KOLONNE IN DIE RICHTIGE (AUFSTEIGENDE) ZAHLENFOLGE.");
    tty.print("SIE LEGEN DIE LAENGE DER KOLONNE (MAX.20) FEST.");
    tty.print("SIE SAGEN MIR WIEVIELE ZAHLEN UMGEDREHT WERDEN SOLLEN");
    tty.print('ALS BEISPIEL SEHEN SIE FOLGENDE ZEILE: "2 3 4 5 1 6 7 8 9"');
    tty.print('SIE DREHEN 4 UM, DAS RESULTAT SIEHT SO AUS: "5 4 3 2 1 6 7 8 9"');
    tty.print('DREHEN SIE NUN 5 UM HABEN SIE GEWONNEN ! "1 2 3 4 5 6 7 8 9"');
    tty.print("WENN SIE ABBRECHEN MOECHTEN ANTWORTEN SIE BITTE MIT 0 (NULL)");
    tty.print("");
  }
  let N = 0;
  while (!(N > 1 && N <= 20)) {
    N = Number(await tty.input("WIEVIELE ZAHLEN SOLL IHRE KOLONNE ENTHALTEN ?", "numeric"));
    if (N > 20) tty.print("!!! MAX. GROESSE IST 20 !!!");
    else if (!(N > 1)) tty.print("BITTE NEUE EINGABE");
  }
  const A = [];
  while (A.length < N) { const k = Math.floor(N * Math.random()) + 1;
    if (!A.includes(k)) A.push(k); }
  tty.print("WIR STARTEN: DIE ZAHLENKOLONNE SIEHT SO AUS:");
  const show = () => tty.print(A.map(x => String(x).padStart(3)).join(" "));
  show();
  let T = 0;
  while (true) {
    const R = Number(await tty.input("WIEVIELE ZAHLEN SOLLEN GEDREHT WERDEN ?", "numeric"));
    if (R === 0) { tty.print("ENDE"); return; }
    if (!(R >= 1 && R <= N)) { tty.print("DAS SIND ZUVIELE, SIE KOENNEN MAX. UMDREHEN: " + N); continue; }
    T++;
    for (let k = 0; k < Math.floor(R / 2); k++) {
      const z = A[k]; A[k] = A[R - 1 - k]; A[R - 1 - k] = z;
    }
    show();
    if (A.every((v, i) => v === i + 1)) {
      tty.print("                    **** GRATULATION ****");
      tty.print("SIE HABEN IN NUR " + T + " ZUEGEN GEWONNEN");
      tty.print("");
      const w = await tty.buttons("MOECHTEN SIE EINE WIEDERHOLUNG ? [JA/NEIN]",
        [{ label: "JA", value: "J" }, { label: "NEIN", value: "N" }]);
      if (w === "J") location.reload(); else tty.print("ENDE");
      return;
    }
  }
}
main(tty);
</script>
</body></html>
