  <div class="sub">BASIC-Programm RAETSEL — Alphametik SEND+MORE=MONEY per Brute-Force, wie 1984.</div>
  <div id="tty" aria-live="polite"></div>
  <div id="ui"></div>
  <div class="sub" style="margin-top:24px">Original-Listing: <a href="listings/RAETSEL.pdf">PDF-Scan</a> · <a href="listings/RAETSEL.txt">TXT (OCR)</a></div>
</div>
<script>
const ttyEl = document.getElementById('tty');
const tty = {
  print(s = "") { const d = document.createElement("div"); d.textContent = s;
    ttyEl.appendChild(d); ttyEl.scrollTop = ttyEl.scrollHeight; },
  html(s) { const d = document.createElement("div"); d.innerHTML = s;
    ttyEl.appendChild(d); ttyEl.scrollTop = ttyEl.scrollHeight; },
  clear() { ttyEl.innerHTML = ""; },
  input(prompt, mode) {
    return new Promise((res) => {
      const f = document.createElement("form");
      f.className = "row";
      const lb = document.createElement("span"); lb.textContent = prompt;
      lb.style.cssText = "color:#87C3FF";
      const inp = document.createElement("input");
      inp.autocomplete = "off"; inp.style.cssText = "flex:1;min-width:100px";
      if (mode) inp.inputMode = mode;
      const b = document.createElement("button"); b.type = "submit"; b.textContent = "Eingabe";
      f.append(lb, inp, b);
      ttyEl.appendChild(f); inp.focus(); ttyEl.scrollTop = ttyEl.scrollHeight;
      f.onsubmit = (e) => { e.preventDefault(); const v = inp.value; f.remove();
        tty.print(prompt + " " + v); res(v); };
    });
  },
  buttons(label, opts) {
    return new Promise((res) => {
      const w = document.createElement("div"); w.className = "row";
      if (label) { const s = document.createElement("span");
        s.textContent = label; s.style.color = "#87C3FF"; w.appendChild(s); }
      opts.forEach((o) => { const b = document.createElement("button");
        b.type = "button"; b.textContent = o.label; b.className = o.cls || "pill";
        b.onclick = () => { w.remove(); tty.print(label ? label + " " + o.label : o.label); res(o.value); };
        w.appendChild(b); });
      ttyEl.appendChild(w); ttyEl.scrollTop = ttyEl.scrollHeight;
    });
  },
};

async function main(tty) {
  tty.print("RAETSEL - ein arithmetisches Denkspiel");
  tty.print("Z1(=SEND) + Z2(=MORE) soll Z3(=MONEY) ergeben.");
  tty.print("Jeder Buchstabe wird mit einer Ziffer belegt.");
  tty.print("Vorlaeufige Rechenzeit: etwa 6 Stunden. (1984, HP-BASIC)");
  tty.print("");
  const t0 = performance.now();
  let iter = 0, found = 0;
  const Mset = new Set();
  outer:
  for (let M = 0; M <= 9; M++)
  for (let O = 0; O <= 9; O++) { if (O === M) continue;
  for (let N = 0; N <= 9; N++) { if (N === M || N === O) continue;
  for (let E = 0; E <= 9; E++) { if ([M,O,N].includes(E)) continue;
    const MS = 1000*M + 100*O + 10*N + E;
  for (let Y = 0; Y <= 9; Y++) { if ([M,O,N,E].includes(Y)) continue;
  for (let R = 0; R <= 9; R++) { if ([M,O,N,E,Y].includes(R)) continue;
  for (let S = 0; S <= 9; S++) { if ([M,O,N,E,Y,R].includes(S)) continue;
  for (let D = 0; D <= 9; D++) { if ([M,O,N,E,Y,R,S].includes(D)) continue;
    iter++;
    if ((M*1000+O*100+N*10+E) + (S*1000+E*100+N*10+D) ===
        (S*10000+E*1000+N*100+O*10+Y)) {
      found++;
      tty.print("LOESUNG GEFUNDEN:");
      tty.print("  D=" + D + " E=" + E + " M=" + M + " N=" + N +
                " O=" + O + " R=" + R + " S=" + S + " Y=" + Y);
      tty.print("");
      tty.print("   " + (S*1000+E*100+N*10+D) + " + " +
                (M*1000+O*100+N*10+E) + " = " +
                (S*10000+E*1000+N*100+O*10+Y));
      tty.print("   SEND   +   MORE   =  MONEY");
      tty.print("");
      break outer;
    }
  }}}}}}}
  if (!found) tty.print("Keine Loesung gefunden.");
  else {
    const dt = ((performance.now() - t0) / 1000).toFixed(2);
    tty.print("LOESUNGSZEIT: " + dt + " SEKUNDEN   (" + iter + " Versuche)");
    tty.print("(Auf dem HP-2000 hiess es: 'Die Loesung wird ca. 6 Stunden benoetigen.')");
  }
  await tty.input("[RETURN]");
  tty.print("ENDE");
}
main(tty);
</script>
