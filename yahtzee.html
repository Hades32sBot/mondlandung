<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YAHTZEE</title>
<meta name="description" content="BASIC-Programm YAHTZEE — Wuerfelspiel von Jobst Brandt (HP, 01 Apr 82), 1-8 Spieler." />
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#0B0E14; color:#E4E4E4;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  .page { max-width:900px; margin:0 auto; padding:28px 20px 64px; }
  .back { display:inline-block; color:#87C3FF; text-decoration:none; margin-bottom:18px; font-size:14px; }
  h1 { font-size:26px; letter-spacing:5px; margin:0 0 6px; }
  .sub { color:#A3B0C4; font-size:14px; margin-bottom:20px; line-height:1.5; }
  #tty { background:#101214; border:1px solid #23272f; border-radius:8px;
    padding:14px 16px; min-height:180px; max-height:62vh; overflow:auto;
    white-space:pre-wrap; font-size:14px; line-height:1.55; color:#3FA266; }
  #tty .in-line { color:#87C3FF; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  input, select { background:#181818; border:1px solid #23272f; color:#E4E4E4;
    border-radius:6px; padding:8px 10px; font:inherit; }
  button { background:#599CE7; color:#191C22; border:0; border-radius:6px;
    padding:8px 16px; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:#87C3FF; border:1px solid #23272f; }
  button.pill { background:#181818; color:#E4E4E4; border:1px solid #23272f; padding:6px 14px; }
  button.sel { border-color:#599CE7; color:#87C3FF; }
  table { border-collapse:collapse; margin:8px 0; }
  td, th { border:1px solid #23272f; padding:4px 10px; text-align:right; }
  th { color:#87C3FF; font-weight:600; text-align:left; }
  .tblwrap { overflow:auto; max-width:100%; }
  .green { color:#3FA266; } .dim { color:#7E8A9E; } .acc { color:#599CE7; }
</style></head><body>
<div class="page">
  <a class="back" href="index.html">&larr; Uebersicht</a>
  <h1>YAHTZEE</h1>
  <div class="sub">BASIC-Programm YAHTZEE — Wuerfelspiel von Jobst Brandt (HP, 01 Apr 82), 1-8 Spieler.</div>
  <div id="tty" aria-live="polite"></div>
  <div id="ui"><div id="game" class="tblwrap"></div></div>
</div>
<script>
const ttyEl = document.getElementById('tty');
const tty = {
  print(s = "") { const d = document.createElement("div"); d.textContent = s;
    ttyEl.appendChild(d); ttyEl.scrollTop = ttyEl.scrollHeight; },
  html(s) { const d = document.createElement("div"); d.innerHTML = s;
    ttyEl.appendChild(d); ttyEl.scrollTop = ttyEl.scrollHeight; },
  clear() { ttyEl.innerHTML = ""; },
  input(prompt) {
    return new Promise((res) => {
      const f = document.createElement("form");
      f.className = "row";
      const lb = document.createElement("span"); lb.textContent = prompt;
      lb.style.cssText = "color:#87C3FF";
      const inp = document.createElement("input");
      inp.autocomplete = "off"; inp.style.cssText = "flex:1;min-width:100px";
      const b = document.createElement("button"); b.type = "submit"; b.textContent = "Eingabe";
      f.append(lb, inp, b);
      ttyEl.appendChild(f); inp.focus(); ttyEl.scrollTop = ttyEl.scrollHeight;
      f.onsubmit = (e) => { e.preventDefault(); const v = inp.value; f.remove();
        tty.print(prompt + " " + v); res(v); };
    });
  },
  buttons(label, opts) {
    return new Promise((res) => {
      const w = document.createElement("div"); w.className = "row";
      if (label) { const s = document.createElement("span");
        s.textContent = label; s.style.color = "#87C3FF"; w.appendChild(s); }
      opts.forEach((o) => { const b = document.createElement("button");
        b.type = "button"; b.textContent = o.label; b.className = o.cls || "pill";
        b.onclick = () => { w.remove(); tty.print(label ? label + " " + o.label : o.label); res(o.value); };
        w.appendChild(b); });
      ttyEl.appendChild(w); ttyEl.scrollTop = ttyEl.scrollHeight;
    });
  },
};

const KAT = [
  "EINSER","ZWEIER","DREIER","VIERER","FUENFER","SECHSER",
  "DREI GLEICHE (GESAMT)","VIER GLEICHE (GESAMT)","VOLLES HAUS (25)",
  "KLEINE STRASSE (30)","GROSSE STRASSE (40)","YAHTZEE (50)","CHANCE (GESAMT)"];
const ui = document.getElementById("game");

async function main(tty) {
  tty.print("                        YAHTZEE (01 Apr 82)");
  tty.print("                    Jobst Brandt, Hewlett-Packard");
  tty.print("");
  const hj = await tty.buttons("Wollen Sie die Regeln sehen [J,...]?",
    [{ label: "J", value: "J" }, { label: "Nein", value: "N" }]);
  if (hj === "J") {
    ["YAHTZEE - EIN WUERFELSPIEL",
     "Sie wuerfeln dreimal, wobei beim zweiten und dritten Mal die",
     "Wuerfel durch ihre Buchstaben gewaehlt werden. Das Ergebnis MUSS",
     "in eine der 13 Kategorien eingeordnet werden. Falls der Wurf nicht",
     "zu der gewaehlten Kategorie passt, erhalten Sie eine Null.",
     "Jede Kategorie kann nur einmal gewaehlt werden.",
     "Die Punktezahl fuer die ersten sechs Kategorien ist die Summe",
     "der Wuerfel, die in die Kategorie passen. Drei passende Wuerfel",
     "reichen fuer den Bonus. Bei den restlichen Kategorien gilt die",
     "Punktezahl in Klammern. Beim 'vollen Haus' muessen mindestens je-",
     "weils zwei Wuerfel gleich sein. Eine 'Strasse' hat aufeinander-",
     "folgende Augenzahlen. Fuenf gleiche Wuerfel, YAHTZEE, darf auch",
     "als YAHTZEE eingeordnet werden, wenn YAHTZEE bereits vergeben ist.",
     "100 Sonderpunkte werden fuer jedes zusaetzliches YAHTZEE vergeben.",
     "'Chance' akzeptiert jeden Wurf."].forEach(l => tty.print("          " + l));
    tty.print("");
  }
  const nS = await tty.input("Wieviele wollen spielen (1 bis 8):");
  const N = Math.min(8, Math.max(1, parseInt(nS) || 1));
  const namen = [];
  for (let i = 1; i <= N; i++) {
    const nm = (await tty.input("Spieler Nr. " + i + ":")).trim();
    namen.push(nm || "Spieler Nr. " + i);
  }

  const T = Array.from({ length: N }, () => Array(16).fill(null)); // 13 KAT + ZwS + Bonus + Ges
  const roll = (g) => g.map(v => v === null ? 1 + Math.floor(Math.random() * 6) : v);
  const wert = (cat, dice, tp) => {
    const P = [0,0,0,0,0,0]; dice.forEach(d => P[d-1]++);
    const S = dice.reduce((a,b) => a+b, 0), Mx = Math.max(...P);
    if (cat <= 5) return P[cat] * (cat + 1);
    if (cat === 6) return Mx >= 3 ? S : 0;
    if (cat === 7) return Mx >= 4 ? S : 0;
    if (cat === 8) return P.every(c => c !== 1) ? 25 : 0;
    if (cat === 9 || cat === 10) {
      let run = 0, best = 0;
      for (let m = 0; m < 6; m++) { run = P[m] ? run + 1 : 0; best = Math.max(best, run); }
      if (best >= cat - 5) return cat === 9 ? 30 : 40;
      if (Mx === 5 && tp[11] !== null && tp[dice[0] - 1] !== null) return cat === 9 ? 30 : 40;
      return 0;
    }
    if (cat === 11) return Mx === 5 ? 50 : 0;
    return S;
  };

  const PIP = ["","\u2680","\u2681","\u2682","\u2683","\u2684","\u2685"];
  const buch = ["A","B","C","D","E"];
  const state = { dice: [0,0,0,0,0], hold: [false,false,false,false,false], wuerfe: 0, spieler: 0 };

  function render() {
    const p = state.spieler, tp = T[p];
    let h = "<table><tr><th></th>";
    namen.forEach((nm,i) => h += "<th" + (i===p ? ' style="color:#599CE7"' : "") + ">" +
      (i===p?"&rarr; ":"") + nm + "</th>");
    h += "</tr>";
    const zw = tp.slice(0,6).reduce((a,b)=>a+(b||0),0);
    const bonus = zw >= 63 ? 35 : 0;
    const ges = tp.slice(0,13).reduce((a,b)=>a+(b||0),0) + bonus + (tp.yb||0);
    const rows = [];
    for (let c = 0; c < 16; c++) {
      let label, vals = [];
      if (c < 13) { label = (c+1) + ". " + KAT[c]; for (let i=0;i<N;i++) vals.push(T[i][c]); }
      else if (c === 13) { label = "   ZWISCHENSUMME";
        for (let i=0;i<N;i++) vals.push(T[i].slice(0,6).reduce((a,b)=>a+(b||0),0)); }
      else if (c === 14) { label = "   BONUS, Z.SUMME >=63 (35)";
        for (let i=0;i<N;i++) vals.push(T[i].slice(0,6).reduce((a,b)=>a+(b||0),0)>=63?35:(T[i].slice(0,6).some(v=>v!==null)?0:null)); }
      else { label = "   GESAMTSUMME";
        for (let i=0;i<N;i++) vals.push(T[i].slice(0,13).reduce((a,b)=>a+(b||0),0)+(T[i].slice(0,6).reduce((a,b)=>a+(b||0),0)>=63?35:0)+(T[i].yb||0)); }
      h += "<tr><td>" + label + "</td>";
      vals.forEach((v,i) => {
        if (c < 13 && i === p && T[i][c] === null && state.wuerfe > 0) {
          h += '<td><button class="pill" data-kat="'+c+'">' + wert(c,state.dice,tp) + '</button></td>';
        } else h += "<td>" + (v === null ? "." : v) + "</td>";
      });
      h += "</tr>";
    }
    h += "</table>";
    // Wuerfelzeile
    h += '<div class="row" style="margin:14px 0 4px"><span class="dim">Wurf ' + state.wuerfe + '/3 — ' + namen[p] + '</span></div>';
    h += '<div class="row">' + state.dice.map((d,i) =>
      '<button class="pill' + (state.hold[i] ? '' : ' sel') + '" data-die="'+i+'" style="font-size:22px;min-width:52px"' +
      (state.wuerfe === 0 ? ' disabled' : '') + '>' +
      (d ? PIP[d] : "-") + '<br><span style="font-size:11px" class="dim">' + buch[i] +
      (state.hold[i] && state.wuerfe ? ' (halten)' : '') + '</span></button>'
    ).join("") + "</div>";
    h += '<div class="row">' +
      (state.wuerfe < 3 ? '<button id="wuerf">' + (state.wuerfe ? "Nochmals wuerfeln" : "Wuerfeln") + '</button>' : '') +
      '<span class="dim">angeklickte Wuerfel werden gehalten</span></div>';
    ui.innerHTML = h;
    ui.querySelectorAll("[data-die]").forEach(b => b.onclick = () => {
      state.hold[+b.dataset.die] = !state.hold[+b.dataset.die]; render(); });
    const w = document.getElementById("wuerf");
    if (w) w.onclick = () => { state.dice = state.dice.map((d,i) => state.hold[i] ? d : 1+Math.floor(Math.random()*6));
      state.wuerfe++; render(); };
    ui.querySelectorAll("[data-kat]").forEach(b => b.onclick = () => {
      const c = +b.dataset.kat, val = wert(c, state.dice, tp);
      tp[c] = val;
      const Mx = Math.max(...[0,0,0,0,0,0].map((_,m)=>state.dice.filter(d=>d===m+1).length));
      if (Mx === 5 && tp[11] === 50) tp.yb = (tp.yb || 0) + 100;
      state.hold = [false,false,false,false,false];
      state.wuerfe = 0; state.dice = [0,0,0,0,0];
      next();
    });
  }

  let runde = 1;
  function next() {
    state.spieler++;
    if (state.spieler >= N) { state.spieler = 0; runde++; }
    if (runde > 13) { ende(); return; }
    tty.print("--- Runde " + runde + ": " + namen[state.spieler] + " ist dran ---");
    render();
  }

  function ende() {
    render();
    const sums = T.map(t => t.slice(0,13).reduce((a,b)=>a+(b||0),0) +
      (t.slice(0,6).reduce((a,b)=>a+(b||0),0)>=63?35:0) + (t.yb||0));
    const best = Math.max(...sums);
    const win = namen.filter((_,i)=>sums[i]===best).join(", ");
    tty.print("*** SPIELENDE ***  Sieger: " + win + " mit " + best + " Punkten!");
    const w = document.createElement("div"); w.className="row";
    const b = document.createElement("button"); b.textContent="Noch ein Spiel?";
    b.onclick=()=>location.reload(); w.appendChild(b); ui.appendChild(w);
  }

  tty.print("--- Runde 1: " + namen[0] + " ist dran ---");
  render();
}
main(tty);
</script>
</body></html>
